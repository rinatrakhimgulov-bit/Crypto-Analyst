name: B2 Market Structure integrated research suite

on:
  push:
    branches:
      - feature/b2e-breakout-retest-lifecycle-2026-11-27
      - feature/b2f-mtf-structure-confluence-2026-11-27
      - feature/b2g-chart-projection-contract-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b2-research-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integrated candidate chain
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run B2-A
        run: node tests/b2a-causal-swing-engine.test.cjs
      - name: Run B2-B
        run: node tests/b2b-swing-sequence-engine.test.cjs
      - name: Run B2-C
        run: node tests/b2c-swing-structure-engine.test.cjs
      - name: Run B2-D
        run: node tests/b2d-support-resistance-engine.test.cjs
      - name: Run B2-E
        run: node tests/b2e-breakout-retest-engine.test.cjs

      - name: Run B2-F
        run: node tests/b2f-mtf-structure-confluence-engine.test.cjs

      - name: Run B2-G
        run: node tests/b2g-chart-projection-engine.test.cjs
