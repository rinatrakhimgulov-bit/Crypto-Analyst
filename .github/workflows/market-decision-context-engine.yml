name: Market Decision Context Engine

on:
  pull_request:
    paths:
      - 'src/analysis/market-decision-context-engine.js'
      - 'tests/market-decision-context-engine.test.cjs'
      - 'docs/specs/MARKET_DECISION_CONTEXT_ENGINE_SPEC_2026-11-28.md'
      - '.github/workflows/market-decision-context-engine.yml'
  push:
    branches:
      - 'feature/market-decision-context-engine-2026-11-28'
permissions:
  contents: read
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse engine source
        run: node --check src/analysis/market-decision-context-engine.js
      - name: Run decision context tests
        run: node tests/market-decision-context-engine.test.cjs
      - name: Run upstream engine regression suites
        run: |
          node tests/market-impulse-event-engine.test.cjs
          node tests/b2d-zone-context-engine.test.cjs
          node tests/b2e-breakout-quality-engine.test.cjs
