name: B8 statistical validation
on:
  pull_request:
    branches:
      - main
      - feature/b7-setup-engine-2026-11-28
concurrency:
  group: b8-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  b8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check src/research/b8-outcome-evaluator.js
          node --check src/research/b8-statistics.js
          node --check src/research/b8-journal-adapter.js
          node --check src/research/b8-journal-report.js
          node --check tools/b8_journal_validation.cjs
          node --check tests/b8-journal-report.test.cjs
          node --check src/research/b8-candidate-collection.js
          node --check tests/b8-statistics.test.cjs
          node --check tools/b8_historical_validation.cjs
          node --check tests/b8-outcome-evaluator.test.cjs
          node --check tests/b8-journal-adapter.test.cjs
          node --check tests/b8-candidate-collection.test.cjs
      - name: Deterministic evaluator tests
        run: |
          node tests/b8-outcome-evaluator.test.cjs
          node tests/b8-journal-adapter.test.cjs
          node tests/b8-journal-report.test.cjs
          node tests/b8-candidate-collection.test.cjs
          node tests/b8-statistics.test.cjs
      - name: Generate pinned B7 candidate sample
        run: node tools/b2_historical_replay.cjs > /dev/null
      - name: Evaluate historical outcomes
        run: node tools/b8_historical_validation.cjs
      - name: Upload B8 research report
        uses: actions/upload-artifact@v4
        with:
          name: b8-historical-validation-report
          path: |
            b8_historical_validation_report.json
            b8_historical_validation_report.md
