name: B8 statistical validation
on:
  pull_request:
    branches:
      - main
      - feature/b7-setup-engine-2026-11-28
  push:
    branches:
      - feature/b8-statistical-validation-2026-11-28
permissions:
  contents: read
jobs:
  b8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check src/research/b8-outcome-evaluator.js
          node --check src/research/b8-statistics.js
          node --check src/research/b8-journal-adapter.js
          node --check tests/b8-outcome-evaluator.test.cjs
          node --check tests/b8-journal-adapter.test.cjs
      - name: Deterministic evaluator tests
        run: node tests/b8-outcome-evaluator.test.cjs
          node tests/b8-journal-adapter.test.cjs
