name: B5 Market Journal Verification

on:
  pull_request:
    branches:
      - feature/b4-live-data-hardening-2026-11-28
      - feature/b5-market-journal-2026-11-28
      - feature/b6-analytics-audit-2026-11-28
      - feature/b7-setup-engine-2026-11-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run B5 journal browser contract checks
        run: node tests/b5-market-journal-browser-check.cjs
