name: B2-E breakout retest lifecycle tests

on:
  push:
    branches:
      - feature/b2e-breakout-retest-lifecycle-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b2e-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic B2-E tests
        run: node tests/b2e-breakout-retest-engine.test.cjs
