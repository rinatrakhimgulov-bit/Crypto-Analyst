name: B2-C BOS CHoCH state-machine tests

on:
  push:
    branches:
      - feature/b2c-bos-choch-state-machine-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b2c-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic B2-C tests
        run: node tests/b2c-swing-structure-engine.test.cjs
