name: Analytical context historical replay

on:
  push:
    branches:
      - feature/analytical-engine-historical-replay-2026-11-28
  pull_request:
    branches:
      - feature/analytical-engine-integration-2026-11-28
      - feature/analytical-engine-historical-replay-2026-11-28
      - feature/market-regime-engine-v2-2026-11-28
      - feature/market-regime-engine-v2-2026-11-28
    paths:
      - 'tools/analytical_context_historical_replay.cjs'
      - 'tools/fetch_bybit_history_extension.cjs'
      - 'tests/bybit-history-extension.test.cjs'
      - 'tools/b2_historical_replay.cjs'
      - 'src/analysis/**'
      - 'tests/analytical-context-historical-replay.test.cjs'
      - '.github/workflows/analytical-context-historical-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-context-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Market Regime Engine v1 baseline tests
        run: node tests/market-regime-engine.test.cjs
      - name: Market Regime Engine v2 unit tests
        run: node tests/market-regime-engine-v2.test.cjs
      - name: Read-only HTML integration assertions
        run: node tests/analytical-engine-integration.test.cjs
      - name: Synthetic end-to-end analytical replay tests
        run: node tests/analytical-engine-replay.test.cjs
      - name: Check Bybit history extension parser
        run: |
          node --check tools/fetch_bybit_history_extension.cjs
          node tests/bybit-history-extension.test.cjs
      - name: Fetch closed 2026 Bybit BTC/ETH klines
        run: node tools/fetch_bybit_history_extension.cjs
      - name: Replay six historical BTC/ETH series with 2026 extension
        env:
          REQUIRE_BYBIT_EXTENSION: '1'
        run: node tools/analytical_context_historical_replay.cjs
      - name: Verify report coverage and causal assertions
        env:
          REQUIRE_BYBIT_EXTENSION: '1'
        run: node tests/analytical-context-historical-replay.test.cjs
      - name: Upload historical analytical context report
        uses: actions/upload-artifact@v4
        with:
          name: analytical-context-historical-replay-report
          path: analytical_context_historical_replay_report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload raw 2026 extension for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: bybit-2026-history-extension
          path: bybit_2026_history_extension.json
          if-no-files-found: error
          retention-days: 30
