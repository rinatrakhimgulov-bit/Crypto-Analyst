name: Binance USD-M Recent Analytical Replay

on:
  pull_request:
    branches:
      - 'feature/market-regime-engine-v2-2026-11-28'
      - 'feature/binance-usdm-recent-replay-2026-11-28'
    paths:
      - 'tools/fetch_binance_um_recent_history.cjs'
      - 'tools/binance_usdm_recent_replay.cjs'
      - 'tools/b2_historical_replay.cjs'
      - 'tests/binance-usdm-recent-replay.test.cjs'
      - 'tests/binance-usdm-recent-replay-report.test.cjs'
      - '.github/workflows/analytical-context-historical-replay.yml'
      - 'src/analysis/**'

jobs:
  recent-futures-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Market Regime v1 baseline tests
        run: node tests/market-regime-engine.test.cjs
      - name: Market Regime v2 tests
        run: node tests/market-regime-engine-v2.test.cjs
      - name: Read-only application integration assertions
        run: node tests/analytical-engine-integration.test.cjs
      - name: Synthetic end-to-end replay tests
        run: node tests/analytical-engine-replay.test.cjs
      - name: Check Binance archive parser and replay scripts
        run: |
          node --check tools/fetch_binance_um_recent_history.cjs
          node --check tools/binance_usdm_recent_replay.cjs
          node tests/binance-usdm-recent-replay.test.cjs
      - name: Fetch and checksum-verify Binance USD-M futures archive
        run: node tools/fetch_binance_um_recent_history.cjs
      - name: Replay recent BTC/ETH futures history
        run: node tools/binance_usdm_recent_replay.cjs
      - name: Verify recent replay report
        run: node tests/binance-usdm-recent-replay-report.test.cjs
      - name: Upload Binance recent replay report
        uses: actions/upload-artifact@v4
        with:
          name: binance-usdm-recent-replay-report
          path: binance_usdm_recent_replay_report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksum-verified Binance data
        uses: actions/upload-artifact@v4
        with:
          name: binance-usdm-recent-history
          path: binance_usdm_recent_history.json
          if-no-files-found: error
          retention-days: 30
