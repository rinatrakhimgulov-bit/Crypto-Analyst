name: B2-F multi-timeframe structure confluence tests

on:
  push:
    branches:
      - feature/b2f-mtf-structure-confluence-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b2f-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic B2-F tests
        run: node tests/b2f-mtf-structure-confluence-engine.test.cjs
