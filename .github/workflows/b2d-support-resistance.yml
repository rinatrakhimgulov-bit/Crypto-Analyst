name: B2-D support resistance zone tests

on:
  push:
    branches:
      - feature/b2d-support-resistance-zones-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b2d-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic B2-D tests
        run: node tests/b2d-support-resistance-engine.test.cjs
